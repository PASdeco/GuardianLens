name: Guardian recall check

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-recalls.mjs
        env:
          GUARDIAN_APP_URL: ${{ secrets.GUARDIAN_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
